[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changeling14-training-gui"
version = "0.1.0"
description = "Desktop control panel for the Changeling14 Vision training pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
changeling14-gui = "changeling14_gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
changeling14_gui = ["jobs.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
